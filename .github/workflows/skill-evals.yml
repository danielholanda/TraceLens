# Run skillscope on evals.json (same intake criteria as amd/skills)

name: AMD Skills Checks

on:
  pull_request:
    paths:
      - "TraceLens/Agent/Analysis/skills/**"
      - ".github/workflows/skill-evals.yml"
  workflow_dispatch:
    inputs:
      structural:
        description: Structural evals
        type: choice
        options:
          - required
          - off
        default: required
      routing:
        description: Routing evals
        type: choice
        options:
          - required
          - off
        default: off
      behavioral:
        description: Behavioral evals
        type: choice
        options:
          - required
          - off
        default: off

permissions:
  contents: read

jobs:
  evals:
    name: AMD Skills Checks
    uses: amd/skillscope/.github/workflows/reusable.yml@main
    secrets:
      api_key: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      skills: TraceLens/Agent/Analysis/skills/analysis-orchestrator
      # Each step can be set to `required`, `optional`, or `off`.
      structural: ${{ github.event.inputs.structural || 'required' }}
      routing: ${{ github.event.inputs.routing || 'off' }}
      behavioral: ${{ github.event.inputs.behavioral || 'off' }}