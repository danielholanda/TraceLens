# Grade the analysis-orchestrator skill with skillscope, from the dataset that
# ships beside it at
# TraceLens/Agent/Analysis/skills/analysis-orchestrator/evals/evals.json.
#
# Behavior only: the prompt runs to completion and what it left behind is
# graded, which here is the standalone repeatability case -- download a trace,
# install TraceLens, write analysis.md and the rest of the report. skillscope
# also grades routing, whether a description fires for the right prompts, but
# that question belongs to the catalog this skill is published into rather than
# to this repo: routing is only meaningful against the neighbours a skill
# competes with, and there is one skill here. amd/skills runs it there.
#
# Until now these prompts were only graded in amd/skills, against whatever
# commit of this repo it had vendored. Running the behavior case here grades the
# change under review instead.
#
# skillscope publishes a reusable pipeline that would collapse this file into one
# job, and it is not used yet because its steps reference
# `amd/skillscope@bootstrap`, which is not a repository, and the behavior matrix
# it plans appends the platform to the runner labels (`["ubuntu-latest",
# "Linux"]`), which no GitHub-hosted runner matches. Calling the action directly
# is the documented alternative and needs neither.

name: skill-evals

on:
  pull_request:
    paths:
      # The skill's body decides what a behavior run does, its dataset decides
      # what is asked of it. Nothing else here pays for a run.
      - "TraceLens/Agent/Analysis/skills/analysis-orchestrator/**"
      - ".github/workflows/skill-evals.yml"
  workflow_dispatch:

concurrency:
  group: skill-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Secret-free and instant, so a malformed dataset fails here rather than
  # halfway through a paid run.
  validate:
    name: Validate the eval dataset
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate every eval dataset
        uses: danielholanda/skillscope@main
        with:
          command: validate
          skills: TraceLens/Agent/Analysis/skills/*

  # Installs TraceLens and runs the whole analysis workflow on a real trace, so
  # it is slow and its report is worth keeping whether it passed or not.
  behavior:
    name: Behavior (analysis-orchestrator)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Passed to the agent the harness drives. A gateway instead of the
      # provider default also wants ANTHROPIC_BASE_URL and, if it takes the key
      # in a header, ANTHROPIC_CUSTOM_HEADERS.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Verify the Anthropic key is available
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "ANTHROPIC_API_KEY resolved to an empty value. GitHub withholds" >&2
            echo "secrets from pull requests opened from forks; re-run this from a" >&2
            echo "branch in this repository, or check that the secret is set." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run behavior cases for analysis-orchestrator
        uses: danielholanda/skillscope@main
        with:
          command: run
          args: >-
            --mode behavior
            --skill analysis-orchestrator
            --output behavior-report.json
            --keep-logs behavior-logs
          skill: analysis-orchestrator
          skills: TraceLens/Agent/Analysis/skills/*
          install-claude: "true"

      - name: Upload behavior report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-report
          path: |
            behavior-report.json
            behavior-logs/
          if-no-files-found: warn
